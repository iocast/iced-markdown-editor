# Publish to crates.io when a tag "vX.Y.Z" or "vX.Y.Z-rc.N" is pushed (trusted
# publishing). No GitHub release is created; the notes live in CHANGELOG.md.
# One-time setup: publish the first version by hand, add publish.yml with
# environment "release" as trusted publisher on crates.io, create the
# "release" environment on GitHub.

name: Publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libgtk-3-dev
      - name: Tag must match Cargo.toml version
        run: |
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "::error::tag/version mismatch"; exit 1; }
      - run: cargo test --all-features
      - run: cargo publish --dry-run
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
